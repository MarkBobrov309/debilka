name: dsrao
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orchestrator
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator -d orchestrator"]
      interval: 3s
      timeout: 3s
      retries: 20
  migrate:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: orchestrator
      PGUSER: orchestrator
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - ./migrations:/migrations:ro
    command: ["psql", "-X", "-v", "ON_ERROR_STOP=1", "-f", "/migrations/apply.sql"]
    restart: "no"
  controller:
    build:
      context: .
      dockerfile: deploy/controller.Dockerfile
    environment:
      CONTROLLER_HTTP_ADDR: 0.0.0.0:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    depends_on:
      controller:
        condition: service_healthy
    ports:
      - "127.0.0.1:5173:80"
volumes:
  postgres-data:
